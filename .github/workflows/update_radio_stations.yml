name: Update radio stations

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: stations
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dnsutils zstd

      - name: Fetch stations
        run: |
          mkdir -p generated
          python3 scripts/update_radio_stations.py > generated/stations.json

      - name: Check data
        run: |
          jq empty generated/stations.json
          count=$(jq 'length' generated/stations.json)
          echo "stations: $count"
          test "$count" -gt 0

      - name: Check for changes
        id: changes
        run: |
          hash=$(sha256sum generated/stations.json | cut -d' ' -f1)

          old=$(
            curl -fsSL \
              "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/stations.sha256" \
              2>/dev/null || true
          )

          echo "current:  $hash"
          echo "published: $old"

          echo "$hash" > generated/stations.sha256

          if [ "$hash" = "$old" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Compress
        if: steps.changes.outputs.changed == 'true'
        run: zstd -19 --rm generated/stations.json

      - name: Upload station data
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: station-data
          path: |
            generated/stations.json.zst
            generated/stations.sha256
          retention-days: 1